<article
  class="flex h-full min-w-0 flex-col overflow-hidden rounded-2xl border border-(--disable-color) bg-(--forground-color) shadow-sm transition-shadow duration-200 hover:shadow-lg"
>
  <button
    class="group relative mx-3 mt-3 grid min-h-60 w-[calc(100%-1.5rem)] appearance-none place-items-center overflow-hidden rounded-xl border-0 bg-(--background-color) p-0 text-left focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-(--primary)"
    type="button"
    [attr.aria-label]="'Preview image: ' + (product()?.title ?? 'Product')"
    [attr.aria-pressed]="isImageZoomed"
    [class.cursor-zoom-in]="!isImageZoomed"
    [class.cursor-zoom-out]="isImageZoomed"
    (click)="toggleImageZoom()"
    (mousemove)="onMouseMove($event)"
    (mouseleave)="onMouseLeave()"
  >
    <span
      class="pointer-events-none absolute inset-x-0 bottom-0 z-10 bg-linear-to-t from-black/55 to-transparent px-3 pb-3 pt-8 text-xs font-medium text-white opacity-100 transition-opacity sm:opacity-0 group-hover:opacity-100 group-focus-visible:opacity-100"
    >
      {{
        isImageZoomPinned
          ? "Click to reset zoom"
          : "Hover to zoom · Click to pin"
      }}
    </span>
    <span
      class="absolute top-3 left-3 z-10 max-w-[calc(100%-7rem)] truncate rounded-md bg-(--forground-color) px-2.5 py-1.5 text-[0.65rem] font-semibold tracking-wide text-(--primary) uppercase"
    >
      {{ product()?.category }}
    </span>
    @if (product()?.rating; as rating) {
      <span
        class="absolute top-3 right-3 z-10 inline-flex items-center gap-1 rounded-md bg-(--forground-color) px-2 py-1.5 text-xs font-semibold text-(--text-color)"
        [attr.aria-label]="rating.rate + ' out of 5 stars'"
      >
        <mat-icon
          class="!h-4 !w-4 !text-base !leading-4 !text-amber-600"
          aria-hidden="true"
        >
          star
        </mat-icon>
        {{ rating.rate }}
      </span>
    }
    <img
      class="pointer-events-none h-52 w-full object-contain transition-transform duration-200 ease-out"
      [style.transform]="transform"
      [style.transform-origin]="transformOrigin"
      [src]="product()?.image"
      alt=""
    />
  </button>

  <div class="flex min-w-0 flex-1 flex-col p-4 sm:p-5">
    <div
      class="flex min-w-0 flex-wrap items-start justify-between gap-x-3 gap-y-1"
    >
      <h2
        class="line-clamp-2 min-w-0 flex-1 text-base leading-snug font-semibold text-(--text-color)"
        matTooltip="{{ product()?.title }}"
      >
        {{ product()?.title }}
      </h2>
      @if (product()?.rating; as rating) {
        <span class="shrink-0 pt-0.5 text-xs text-(--gray)">
          {{ rating.count }} {{ rating.count === 1 ? "review" : "reviews" }}
        </span>
      }
    </div>

    <p
      class="mt-2 text-sm leading-relaxed text-(--gray)"
      [ngClass]="isLineClamping ? 'line-clamp-2' : ''"
    >
      {{ product()?.description }}
    </p>
    <button
      class="mt-1 self-start cursor-pointer rounded-sm text-left text-xs font-semibold text-(--primary) hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-(--primary)"
      type="button"
      (click)="toggleLineClamping()"
      [attr.aria-expanded]="!isLineClamping"
    >
      {{ isLineClamping ? "Read more" : "Read less" }}
    </button>

    <div class="mt-auto flex flex-wrap items-end justify-between gap-3 pt-5">
      <div class="flex flex-col gap-0.5">
        <span class="text-xs text-(--gray)">Price</span>
        <span class="text-xl font-bold tracking-tight text-(--text-color)">
          {{ product()?.price | currency: "EUR" : "symbol" : "1.2-2" }}
        </span>
      </div>
      <button
        class="inline-flex min-h-9 items-center gap-2 rounded-lg bg-(--primary) px-3 py-2 text-sm font-semibold text-(--white-color) transition-colors hover:bg-sky-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-(--primary) disabled:cursor-not-allowed disabled:opacity-50"
        matButton="filled"
        type="button"
        (click)="addToCart()"
        [disabled]="!product()"
      >
        <mat-icon class="!h-[18px] !w-[18px] !text-lg !leading-[18px]">
          add_shopping_cart
        </mat-icon>
        <span>Add to cart</span>
      </button>
    </div>
  </div>
</article>
